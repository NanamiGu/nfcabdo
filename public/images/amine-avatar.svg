<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fba868" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="200" fill="url(#avatarGrad)" />
  <!-- Shoulders -->
  <path d="M 80 400 C 80 300, 320 300, 320 400 Z" fill="#0f172a" opacity="0.9" />
  <!-- Shirt collar -->
  <path d="M 170 300 L 200 350 L 230 300 Z" fill="#e2e8f0" />
  <!-- Head & Neck -->
  <rect x="180" y="240" width="40" height="70" rx="8" fill="url(#skinGrad)" />
  <ellipse cx="200" cy="190" rx="65" ry="80" fill="url(#skinGrad)" />
  <!-- Hair -->
  <path d="M 135 180 C 135 110, 265 110, 265 180 C 255 140, 145 140, 135 180 Z" fill="#1e293b" />
  <!-- Glasses -->
  <rect x="155" y="175" width="35" height="24" rx="6" fill="none" stroke="#0f172a" stroke-width="4" />
  <rect x="210" y="175" width="35" height="24" rx="6" fill="none" stroke="#0f172a" stroke-width="4" />
  <line x1="190" y1="187" x2="210" y2="187" stroke="#0f172a" stroke-width="4" />
  <!-- Smile -->
  <path d="M 185 225 Q 200 240 215 225" fill="none" stroke="#9a3412" stroke-width="3.5" stroke-linecap="round" />
</svg>
