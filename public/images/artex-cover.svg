<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="coverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3f3f46" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>
  </defs>
  <rect width="1200" height="400" fill="url(#coverBg)" />
  <rect width="1200" height="400" fill="url(#grid)" />
  <circle cx="900" cy="150" r="220" fill="url(#accentGlow)" filter="blur(60px)" />
  <circle cx="300" cy="300" r="180" fill="#3b82f6" fill-opacity="0.15" filter="blur(50px)" />
  <!-- Subtle line geometry -->
  <path d="M 100 350 Q 500 50 1100 200" fill="none" stroke="#71717a" stroke-width="1" stroke-dasharray="6,6" opacity="0.4" />
</svg>
